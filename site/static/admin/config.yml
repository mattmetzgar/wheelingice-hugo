backend:
  name: git-gateway
  branch: main

media_folder: "site/static/img"
public_folder: "/img"

collections:
  - name: "songs"
    label: "Songs"
    label_singular: "Song"
    folder: "site/content/blog"
    path: "{{slug}}/index"
    media_folder: ""
    public_folder: ""
    create: true
    editor:
      preview: false
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Publish Date", name: "date", widget: "datetime"}
      - {label: "Short Description", name: "description", widget: "text", required: false}
      - {label: "Drawing", name: "image", widget: "image", required: false}
      - {label: "Audio File", name: "audio", widget: "file", required: false, media_library: {config: {multiple: false}}}
      - {label: "Listening Link", name: "listen_url", widget: "string", required: false, hint: "Optional SoundCloud, YouTube, or other listening URL"}
      - {label: "Draft", name: "draft", widget: "boolean", default: false}
      - {label: "Text", name: "body", widget: "markdown", required: false}

  - name: "pages"
    label: "Pages"
    files:
      - file: "site/content/_index.md"
        label: "Home Page"
        name: "home"
        fields:
          - {label: "Page Title", name: "title", widget: "string"}
          - {label: "Intro Text", name: "body", widget: "markdown", required: false}
