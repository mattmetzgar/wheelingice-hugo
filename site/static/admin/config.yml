backend:
  name: git-gateway
  branch: main

media_folder: "site/static/img"
public_folder: "/img"

collections:
  - name: "posts"
    label: "Posts"
    label_singular: "Post"
    folder: "site/content/blog"
    path: "{{slug}}/index"
    media_folder: ""
    public_folder: ""
    create: true
    editor:
      preview: false
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "URL Slug", name: "slug", widget: "string", hint: "The web address for this post, such as offensive-1. Use lowercase letters, numbers, and hyphens only.", pattern: ['^[a-z0-9]+(?:-[a-z0-9]+)*$', "Use lowercase letters, numbers, and hyphens only."]}
      - {label: "Publish Date", name: "date", widget: "datetime"}
      - {label: "Short Description", name: "description", widget: "text", required: false}
      - {label: "Drawing", name: "image", widget: "image", required: false, allow_multiple: false}
      - {label: "Audio File", name: "audio", widget: "file", required: false, allow_multiple: false, choose_url: false}
      - {label: "Listening Link", name: "listen_url", widget: "string", required: false, hint: "Optional SoundCloud, YouTube, or other listening URL"}
      - {label: "Draft", name: "draft", widget: "boolean", default: false}
      - {label: "Text", name: "body", widget: "markdown", required: false}

  - name: "pages"
    label: "Pages"
    files:
      - file: "site/content/_index.md"
        label: "Home Page"
        name: "home"
        fields:
          - {label: "Page Title", name: "title", widget: "string"}
          - {label: "Intro Text", name: "body", widget: "markdown", required: false}

  - name: "site_settings"
    label: "Site Settings"
    files:
      - file: "site/data/social.json"
        label: "Social Links"
        name: "social"
        fields:
          - {label: "SoundCloud URL", name: "soundcloud", widget: "string", required: false}
          - {label: "YouTube URL", name: "youtube", widget: "string", required: false}
          - {label: "X / Twitter URL", name: "twitter", widget: "string", required: false}
